name: histproject-backend

x-app: &app
  image: ${BACKEND_IMAGE}
  build: .
  env_file:
    - .env
  networks:
    - app_internal
  restart: always

services:
  api:
    <<: *app
    command: ["/app/api"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:7666/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    <<: *app
    command: ["/app/worker"]
    networks:
      - app_internal
      - render_internal
      - egress
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      chrome:
        condition: service_healthy

  migrate:
    <<: *app
    command: ["/app/migrate", "--apply"]
    profiles: ["tools"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  bootstrap-admin:
    <<: *app
    command: ["/app/bootstrap-admin", "--apply"]
    profiles: ["tools"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.6-alpine3.23
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Yekaterinburg
      PGTZ: Asia/Yekaterinburg
    volumes:
      - db-data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app_internal
    restart: always

  redis:
    image: redis:8.2.9-alpine3.22
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app_internal
    restart: always

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio-storage:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app_internal
      - render_internal
    restart: always

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_ARCHIVE_BUCKET: ${MINIO_ARCHIVE_BUCKET}
      MINIO_SITE_BUCKET: ${MINIO_SITE_BUCKET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://minio:9000 "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY"; do sleep 1; done;
        mc mb --ignore-existing "local/$$MINIO_ARCHIVE_BUCKET";
        mc mb --ignore-existing "local/$$MINIO_SITE_BUCKET";
        printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::%s/*"]}]}' "$$MINIO_SITE_BUCKET" > /tmp/site-policy.json;
        mc anonymous set-json /tmp/site-policy.json "local/$$MINIO_SITE_BUCKET"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - app_internal
    restart: "no"

  chrome:
    image: chromedp/headless-shell:151.0.7922.109
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/9222"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - render_internal
    restart: always

  caddy:
    image: caddy:2.10.2-alpine
    environment:
      PUBLIC_ADDRESS: ${PUBLIC_ADDRESS}
    ports:
      - "80:80"
      - "${HTTPS_BIND:-443}:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../frontend/dist:/srv:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - app_internal
      - egress
    restart: always

volumes:
  db-data:
  minio-storage:
  redis-data:
  caddy-data:
  caddy-config:

networks:
  app_internal:
    internal: true
  render_internal:
    internal: true
  egress:

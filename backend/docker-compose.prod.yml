name: "histproject-backend"

services:
  app:
    image: ghcr.io/airsss993/histproject-backend:main
    pull_policy: always
    build: .
    ports:
      - "7666:7666"
    env_file:
      - .env
    tmpfs:
      - /tmp
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      # clamav:
      #   condition: service_healthy
      chrome:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: "Asia/Yekaterinburg"
      PGTZ: "Asia/Yekaterinburg"
    volumes:
      - db-data:/var/lib/postgresql/18/docker
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./public:/srv/public
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-storage:/data
    ports:
      - "9011:9001"
      - "9010:9000"
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3

  redis:
    image: redis:8.2-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD}" ]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  # clamav:
  #   image: clamav/clamav-debian:stable
  #   ports:
  #     - "3310:3310"
  #   volumes:
  #     - clamav-data:/var/lib/clamav
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 2g
  #       reservations:
  #         memory: 1g
  #   healthcheck:
  #     test: [ "CMD", "clamdcheck.sh" ]
  #     interval: 60s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 300s

  chrome:
    image: chromedp/headless-shell:latest
    entrypoint: >
      /bin/sh -c '
      /headless-shell/headless-shell --no-sandbox --use-gl=angle --use-angle=swiftshader
      --remote-debugging-address=0.0.0.0 --remote-debugging-port=9223 --remote-allow-origins=* &
      exec socat TCP4-LISTEN:9222,fork TCP4:127.0.0.1:9223
      '
    ports:
      - "9222:9222"
    healthcheck:
      test: [ "CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/localhost/9222" ]
      interval: 10s
      timeout: 5s
      retries: 3


volumes:
  db-data:
  minio-storage:
  redis-data:
  # clamav-data:
  caddy-data:
  caddy-config:

openapi: 3.0.3
info:
  title: Histproject API
  version: 1.0.0
  description: >-
    API карты исторических событий и панели модерации.
    Все маршруты /api/, кроме GET /api/v1/auth/session, ограничены 300 запросами в минуту
    с одного IP и при превышении отвечают 429 (RateLimited) с заголовком Retry-After.
    Существующий маршрут с неподдерживаемым методом отвечает 405 method_not_allowed с заголовком Allow.
servers:
  - url: /
tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Events
  - name: Submissions
  - name: Admins
  - name: Profile
  - name: Audit
  - name: Bot
  - name: Mail
paths:
  /healthz:
    get:
      tags: [Health]
      operationId: health
      responses:
        "200":
          description: Процесс работает
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      tags: [Health]
      operationId: readiness
      responses:
        "200":
          description: Все зависимости доступны
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: Одна или несколько зависимостей недоступны
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /api/v1/auth/session:
    get:
      tags: [Auth]
      operationId: getSession
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Роль вошедшего пользователя
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/users/register:
    post:
      tags: [Users]
      operationId: registerUser
      description: Шлёт код на почту. Учётка создаётся только после verify.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegisterInput"
      responses:
        "202":
          description: Код отправлен, действует 10 минут
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/users/login:
    post:
      tags: [Users]
      operationId: requestUserCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "202":
          description: Код отправлен, действует 10 минут
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/users/verify:
    post:
      tags: [Users]
      operationId: verifyUserCode
      description: Проверяет код и ставит куку histproject_user. remember - кука на 30 дней, иначе до закрытия браузера.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  pattern: "^[0-9]{6}$"
                remember:
                  type: boolean
      responses:
        "200":
          description: Сессия создана
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "410":
          description: Кода нет, он истёк или кончились 5 попыток
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/users/me:
    get:
      tags: [Users]
      operationId: getCurrentUser
      security:
        - userCookie: []
      responses:
        "200":
          description: Текущий пользователь
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/users/{id}:
    get:
      tags: [Users]
      operationId: getUserProfile
      description: >
        Публичный профиль автора. Гостю видны только опубликованные работы, автору - все его заявки
        со статусом и комментарием модератора. Заявка связана с учёткой по почте.
      parameters:
        - name: id
          in: path
          required: true
          description: Публичный код автора. Принимается с префиксом RHU- и без, в любом регистре.
          schema:
            type: string
            example: RHU-7K3F9Q
      responses:
        "200":
          description: Профиль автора
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/users/logout:
    post:
      tags: [Users]
      operationId: logoutUser
      responses:
        "204":
          description: Сессия удалена
  /api/v1/events:
    get:
      tags: [Events]
      operationId: listEvents
      parameters:
        - name: eventType
          in: query
          description: Повторяемый фильтр по коду типа
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Страница событий
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPage"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/events/{id}:
    get:
      tags: [Events]
      operationId: getEvent
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Событие
          content:
            application/json:
              schema:
                type: object
                required: [event]
                properties:
                  event:
                    $ref: "#/components/schemas/Event"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/events/{id}/star:
    put:
      tags: [Events]
      operationId: starEvent
      description: Поставить звезду. Одна на пользователя, повтор ничего не меняет.
      security:
        - userCookie: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Звёзды после изменения
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StarState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Events]
      operationId: unstarEvent
      description: Снять звезду. Снять отсутствующую - не ошибка.
      security:
        - userCookie: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Звёзды после изменения
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StarState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/events/{id}/views:
    post:
      tags: [Events]
      operationId: startEventView
      description: >
        Начало просмотра сайта события на странице просмотра. Кука сессии необязательна: вошедший
        записывается аккаунтом. Просмотр автором своего сайта не записывается (204).
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visitorId]
              additionalProperties: false
              properties:
                visitorId:
                  $ref: "#/components/schemas/VisitorID"
      responses:
        "201":
          description: Просмотр записан
          content:
            application/json:
              schema:
                type: object
                required: [viewId]
                properties:
                  viewId:
                    type: integer
                    format: int64
        "204":
          description: Смотрит автор, просмотр не записан
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/events/{id}/views/{viewId}:
    post:
      tags: [Events]
      operationId: touchEventView
      description: >
        Активное время просмотра, всего с его начала. POST, потому что при закрытии страницы запрос
        уходит через navigator.sendBeacon. Время только растёт, не больше прошедшего с начала
        просмотра и не больше 7200 секунд. Принимается только с тем же visitorId.
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: viewId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visitorId, activeSeconds]
              additionalProperties: false
              properties:
                visitorId:
                  $ref: "#/components/schemas/VisitorID"
                activeSeconds:
                  type: integer
                  minimum: 0
      responses:
        "204":
          description: Время записано
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/submissions:
    post:
      tags: [Submissions]
      operationId: createSubmission
      description: Только для вошедшего посетителя. Email автора берётся из аккаунта.
      security:
        - userCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateSubmissionInput"
      responses:
        "201":
          description: Заявка принята в обработку
          content:
            application/json:
              schema:
                type: object
                required: [submission]
                properties:
                  submission:
                    type: object
                    required: [id, publicId, status]
                    properties:
                      id:
                        type: integer
                        format: int64
                      publicId:
                        $ref: "#/components/schemas/SubmissionPublicID"
                      status:
                        $ref: "#/components/schemas/SubmissionStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: Архив превышает лимит
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/admin/submissions:
    get:
      tags: [Submissions]
      operationId: listSubmissions
      security:
        - sessionCookie: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/SubmissionStatus"
        - name: q
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Страница заявок
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/admin/submissions/{id}:
    get:
      tags: [Submissions]
      operationId: getSubmission
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Заявка
          content:
            application/json:
              schema:
                type: object
                required: [submission]
                properties:
                  submission:
                    $ref: "#/components/schemas/Submission"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/admin/submissions/{id}/review:
    post:
      tags: [Submissions]
      operationId: reviewSubmission
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          $ref: "#/components/responses/SubmissionResult"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/admin/submissions/{id}/reject:
    post:
      tags: [Submissions]
      operationId: rejectSubmission
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment]
              properties:
                comment:
                  type: string
                  minLength: 1
                  maxLength: 1000
      responses:
        "200":
          $ref: "#/components/responses/SubmissionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/admin/submissions/{id}/publish:
    post:
      tags: [Submissions]
      operationId: publishSubmission
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishRequest"
      responses:
        "200":
          $ref: "#/components/responses/SubmissionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/admin/events/{id}/coordinates:
    patch:
      tags: [Events]
      operationId: updateEventCoordinates
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Coordinates"
      responses:
        "204":
          description: Координаты обновлены
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/admin/events/{id}:
    delete:
      tags: [Events]
      operationId: deleteEvent
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Событие удалено
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/admin/admins:
    get:
      tags: [Admins]
      operationId: listAdmins
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Список администраторов
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Admin"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Admins]
      operationId: createAdmin
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminInput"
      responses:
        "201":
          description: Администратор создан
          content:
            application/json:
              schema:
                type: object
                required: [admin]
                properties:
                  admin:
                    $ref: "#/components/schemas/Admin"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/admin/admins/{id}/role:
    patch:
      tags: [Admins]
      operationId: changeAdminRole
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  $ref: "#/components/schemas/AdminRole"
      responses:
        "200":
          description: Роль изменена
          content:
            application/json:
              schema:
                type: object
                required: [admin]
                properties:
                  admin:
                    $ref: "#/components/schemas/Admin"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/admin/admins/{id}:
    patch:
      tags: [Admins]
      operationId: updateAdmin
      description: Только super_admin и только чужая роль. Отсутствующее поле не меняется.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                email:
                  type: string
                  description: Почта зарегистрированного пользователя
      responses:
        "200":
          $ref: "#/components/responses/AdminResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Admins]
      operationId: deleteAdmin
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Администратор удален
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/admin/audit-log:
    get:
      tags: [Audit]
      operationId: listAuditLog
      security:
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Журнал модерации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/admin/bot:
    get:
      tags: [Bot]
      operationId: getBot
      description: Только super_admin. Токен бота наружу не отдаётся.
      security:
        - sessionCookie: []
      responses:
        "200":
          $ref: "#/components/responses/BotStatus"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/admin/bot/token:
    put:
      tags: [Bot]
      operationId: setBotToken
      description: Проверяет токен через getMe и сохраняет. Пустая строка отключает бота, получатели остаются.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  format: password
      responses:
        "200":
          $ref: "#/components/responses/BotStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/TelegramUnavailable"
  /api/v1/admin/bot/candidates:
    get:
      tags: [Bot]
      operationId: listBotCandidates
      description: Чаты, писавшие боту за последние сутки (getUpdates) и ещё не получившие доступ.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Кандидаты в получатели
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/TelegramChat"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/TelegramUnavailable"
  /api/v1/admin/bot/recipients:
    post:
      tags: [Bot]
      operationId: grantBotRecipient
      description: Выдаёт чату доступ к уведомлениям. Имя чата берётся у Telegram (getChat).
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chatId]
              properties:
                chatId:
                  type: integer
                  format: int64
      responses:
        "200":
          $ref: "#/components/responses/BotStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/TelegramUnavailable"
  /api/v1/admin/bot/recipients/{chatId}:
    delete:
      tags: [Bot]
      operationId: revokeBotRecipient
      security:
        - sessionCookie: []
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          $ref: "#/components/responses/BotStatus"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/admin/bot/test:
    post:
      tags: [Bot]
      operationId: sendBotTest
      description: Проверочное сообщение всем получателям. 502 telegram_chat_unavailable перечисляет, до кого не дошло.
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Дошло всем
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/TelegramUnavailable"
  /api/v1/admin/mail:
    get:
      tags: [Mail]
      operationId: getMail
      description: Только super_admin. Ключи Postbox задаются env-переменными и наружу не отдаются.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Состояние почты
          content:
            application/json:
              schema:
                type: object
                required: [mail]
                properties:
                  mail:
                    $ref: "#/components/schemas/MailStatus"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/admin/mail/sender:
    put:
      tags: [Mail]
      operationId: setMailSender
      description: Отправитель всех писем. Адрес только на домене EMAIL_FROM, подтверждённом в Postbox. Пока не задан, письма уходят от EMAIL_FROM. 409 mail_not_configured - Postbox не настроен.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, address]
              properties:
                name:
                  type: string
                  maxLength: 100
                  description: Имя отправителя, можно пусто
                address:
                  type: string
                  format: email
      responses:
        "200":
          description: Отправитель сохранён
          content:
            application/json:
              schema:
                type: object
                required: [mail]
                properties:
                  mail:
                    $ref: "#/components/schemas/MailStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/admin/mail/test:
    post:
      tags: [Mail]
      operationId: sendMailTest
      description: Проверочное письмо на указанный адрес. 409 mail_not_configured - Postbox не настроен, 502 mail_unavailable - Postbox не принял письмо, в тексте этап и код SMTP.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "204":
          description: Postbox принял письмо
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          description: Postbox не принял письмо
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: histproject_user
    userCookie:
      type: apiKey
      in: cookie
      name: histproject_user
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
    DateFrom:
      name: dateFrom
      in: query
      schema:
        type: string
        format: date
    DateTo:
      name: dateTo
      in: query
      schema:
        type: string
        format: date
  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Требуется авторизация
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Недостаточно прав
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Конфликт состояния
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Превышен лимит запросов
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Внутренняя ошибка
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TelegramUnavailable:
      description: Telegram не отвечает или не доставил сообщение
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BotStatus:
      description: Состояние бота
      content:
        application/json:
          schema:
            type: object
            required: [bot]
            properties:
              bot:
                $ref: "#/components/schemas/BotStatus"
    AdminResult:
      description: Учётка модератора
      content:
        application/json:
          schema:
            type: object
            required: [admin]
            properties:
              admin:
                $ref: "#/components/schemas/Admin"
    SubmissionResult:
      description: Состояние заявки изменено
      content:
        application/json:
          schema:
            type: object
            required: [submission]
            properties:
              submission:
                $ref: "#/components/schemas/Submission"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [ok, failed]
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string
    UserRegisterInput:
      type: object
      required: [firstName, lastName, email]
      properties:
        firstName:
          type: string
          maxLength: 50
        lastName:
          type: string
          maxLength: 50
        email:
          type: string
          format: email
          maxLength: 254
    UserResponse:
      type: object
      required: [user]
      properties:
        user:
          type: object
          required: [id, publicId, email, firstName, lastName, createdAt]
          properties:
            id:
              type: integer
              format: int64
            publicId:
              $ref: "#/components/schemas/UserPublicID"
            email:
              type: string
            firstName:
              type: string
            lastName:
              type: string
            createdAt:
              type: string
              format: date-time
    ProfileResponse:
      type: object
      required: [user, owner, works]
      properties:
        user:
          type: object
          required: [publicId, firstName, lastName, createdAt]
          properties:
            publicId:
              $ref: "#/components/schemas/UserPublicID"
            firstName:
              type: string
            lastName:
              type: string
            createdAt:
              type: string
              format: date-time
        owner:
          type: boolean
          description: Профиль смотрит сам автор
        works:
          type: array
          items:
            type: object
            required: [publicId, title, eventDate, eventType, status, siteUrl, screenshotUrl, createdAt]
            properties:
              publicId:
                $ref: "#/components/schemas/SubmissionPublicID"
              title:
                type: string
              eventDate:
                type: string
                format: date
              eventType:
                type: string
                enum: [political, military, personality]
              status:
                type: string
                enum: [processing, new, review, rejected, published]
              siteUrl:
                type: string
              screenshotUrl:
                type: string
              comment:
                type: string
                description: Комментарий модератора, только своему профилю
              createdAt:
                type: string
                format: date-time
              eventId:
                type: integer
                format: int64
                description: Событие на карте, есть у опубликованной работы
              stars:
                type: integer
                format: int64
              starred:
                type: boolean
                description: Звезду поставил смотрящий
              visitors:
                type: integer
                format: int64
                description: Уникальные посетители сайта, видны всем, есть у опубликованной работы
              stats:
                type: object
                description: Просмотры сайта, только своему профилю и только у опубликованной работы
                required: [views, visitors, activeSeconds]
                properties:
                  views:
                    type: integer
                    format: int64
                  visitors:
                    type: integer
                    format: int64
                    description: Уникальные посетители - аккаунт, у гостя - браузер
                  activeSeconds:
                    type: integer
                    format: int64
                    description: Суммарное активное время всех просмотров
    SessionResponse:
      type: object
      required: [admin]
      properties:
        admin:
          type: object
          required: [id, login, role]
          properties:
            id:
              type: integer
              format: int64
            login:
              type: string
            name:
              type: string
              description: Пустое у модераторов, заведённых до появления имени
            role:
              $ref: "#/components/schemas/AdminRole"
    TelegramChat:
      type: object
      required: [chatId, title]
      properties:
        chatId:
          type: integer
          format: int64
        title:
          type: string
        username:
          type: string
    BotStatus:
      type: object
      required: [configured, recipients]
      properties:
        configured:
          type: boolean
        username:
          type: string
          description: Имя бота из getMe
        recipients:
          type: array
          items:
            $ref: "#/components/schemas/TelegramChat"
    MailStatus:
      type: object
      required: [configured]
      description: Поля отправителя есть, только если почта настроена
      properties:
        configured:
          type: boolean
        name:
          type: string
          description: Имя отправителя
        address:
          type: string
          format: email
          description: Адрес отправителя - из панели, иначе из EMAIL_FROM
        domain:
          type: string
          description: Домен EMAIL_FROM, на нём должен быть адрес отправителя
    AdminRole:
      type: string
      enum: [admin, super_admin]
    Admin:
      type: object
      required: [id, login, name, email, role, createdAt]
      properties:
        id:
          type: integer
          format: int64
        login:
          type: string
        name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/AdminRole"
        createdAt:
          type: string
          format: date-time
    CreateAdminInput:
      type: object
      required: [name, email, role]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/AdminRole"
    Coordinates:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
    PublishRequest:
      allOf:
        - $ref: "#/components/schemas/Coordinates"
        - type: object
          properties:
            eventType:
              description: Тип, подтверждённый модератором. Пустой или отсутствует - остаётся тип автора.
              type: string
              enum: [political, military, personality]
    Event:
      type: object
      required: [id, title, description, latitude, longitude, eventDate, eventType, siteUrl, stars, starred, visitors]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        eventDate:
          type: string
          format: date
        eventType:
          type: string
        siteUrl:
          type: string
          format: uri
        previewImageUrl:
          type: string
          format: uri
          nullable: true
        stars:
          type: integer
          format: int64
          description: Число поставивших звезду
        starred:
          type: boolean
          description: Звезду поставил текущий пользователь, у гостя false
        visitors:
          type: integer
          format: int64
          description: Уникальные посетители сайта - аккаунт, у гостя - браузер. Просмотры автора не считаются
        author:
          type: object
          description: Только в GET /api/v1/events/{id} и только если у почты заявки есть учётка
          required: [publicId, firstName, lastName]
          properties:
            publicId:
              type: string
              example: RHU-7K3F9Q
            firstName:
              type: string
            lastName:
              type: string
    StarState:
      type: object
      required: [stars, starred]
      properties:
        stars:
          type: integer
          format: int64
        starred:
          type: boolean
    VisitorID:
      type: string
      format: uuid
      description: Случайный id браузера посетителя, UUID в нижнем регистре
    EventPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
          format: int64
    SubmissionStatus:
      type: string
      enum: [processing, new, review, rejected, published]
    CreateSubmissionInput:
      type: object
      required: [title, description, eventDate, eventType, telegramUsername, latitude, longitude, archive]
      properties:
        title:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 450
        eventDate:
          type: string
          format: date
        eventType:
          type: string
          enum: [political, military, personality]
        telegramUsername:
          type: string
          pattern: "^[A-Za-z0-9_]{5,32}$"
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Точка события, которую ставит автор
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        archive:
          type: string
          format: binary
    UserPublicID:
      type: string
      pattern: "^RHU-[0-9A-HJKMNP-TV-Z]{6}$"
      description: Публичный код пользователя. Числовой id наружу в профиле не отдаётся.
      example: RHU-7K3F9Q
    SubmissionPublicID:
      type: string
      pattern: "^RH-[0-9A-HJKMNP-TV-Z]{6}$"
      description: Номер заявки для людей (письма, профиль, панель). Пути API по-прежнему принимают числовой id.
      example: RH-7K3F9Q
    Submission:
      type: object
      required: [id, publicId, title, description, eventDate, eventType, email, telegramUsername, status, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        publicId:
          $ref: "#/components/schemas/SubmissionPublicID"
        title:
          type: string
        description:
          type: string
        eventDate:
          type: string
          format: date
        eventType:
          type: string
        email:
          type: string
          format: email
        telegramUsername:
          type: string
        latitude:
          type: number
          format: double
          description: Нет у заявок, созданных до появления точки от автора
        longitude:
          type: number
          format: double
        siteUrl:
          type: string
        screenshotUrl:
          type: string
        slug:
          type: string
        status:
          $ref: "#/components/schemas/SubmissionStatus"
        adminComment:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SubmissionPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Submission"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
          format: int64
    AuditEntry:
      type: object
      required: [id, submissionId, submissionPublicId, submissionTitle, adminLogin, adminRole, action, createdAt]
      properties:
        id:
          type: integer
          format: int64
        submissionId:
          type: integer
          format: int64
        submissionPublicId:
          $ref: "#/components/schemas/SubmissionPublicID"
        submissionTitle:
          type: string
        adminLogin:
          type: string
        adminRole:
          type: string
        action:
          type: string
        comment:
          type: string
        createdAt:
          type: string
          format: date-time
    AuditPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
          format: int64

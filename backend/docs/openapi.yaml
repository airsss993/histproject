openapi: 3.0.3
info:
  title: Histproject API
  version: 1.0.0
  description: API карты исторических событий и панели модерации.
servers:
  - url: /
tags:
  - name: Health
  - name: Auth
  - name: Events
  - name: Submissions
  - name: Admins
  - name: Audit
paths:
  /healthz:
    get:
      tags: [Health]
      operationId: health
      responses:
        "200":
          description: Процесс работает
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      tags: [Health]
      operationId: readiness
      responses:
        "200":
          description: Все зависимости доступны
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: Одна или несколько зависимостей недоступны
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Сессия создана
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      responses:
        "204":
          description: Сессия удалена
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/session:
    get:
      tags: [Auth]
      operationId: getSession
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Текущая сессия
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/events:
    get:
      tags: [Events]
      operationId: listEvents
      parameters:
        - name: eventType
          in: query
          description: Повторяемый фильтр по коду типа
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Страница событий
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPage"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/events/{id}:
    get:
      tags: [Events]
      operationId: getEvent
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Событие
          content:
            application/json:
              schema:
                type: object
                required: [event]
                properties:
                  event:
                    $ref: "#/components/schemas/Event"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/submissions:
    post:
      tags: [Submissions]
      operationId: createSubmission
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateSubmissionInput"
      responses:
        "201":
          description: Заявка принята в обработку
          content:
            application/json:
              schema:
                type: object
                required: [submission]
                properties:
                  submission:
                    type: object
                    required: [id, status]
                    properties:
                      id:
                        type: integer
                        format: int64
                      status:
                        $ref: "#/components/schemas/SubmissionStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          description: Архив превышает лимит
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/admin/submissions:
    get:
      tags: [Submissions]
      operationId: listSubmissions
      security:
        - sessionCookie: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/SubmissionStatus"
        - name: q
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Страница заявок
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/admin/submissions/{id}:
    get:
      tags: [Submissions]
      operationId: getSubmission
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Заявка
          content:
            application/json:
              schema:
                type: object
                required: [submission]
                properties:
                  submission:
                    $ref: "#/components/schemas/Submission"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/admin/submissions/{id}/review:
    post:
      tags: [Submissions]
      operationId: reviewSubmission
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          $ref: "#/components/responses/SubmissionResult"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/admin/submissions/{id}/reject:
    post:
      tags: [Submissions]
      operationId: rejectSubmission
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment]
              properties:
                comment:
                  type: string
                  minLength: 1
      responses:
        "200":
          $ref: "#/components/responses/SubmissionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/admin/submissions/{id}/publish:
    post:
      tags: [Submissions]
      operationId: publishSubmission
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Coordinates"
      responses:
        "200":
          $ref: "#/components/responses/SubmissionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/admin/events/{id}/coordinates:
    patch:
      tags: [Events]
      operationId: updateEventCoordinates
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Coordinates"
      responses:
        "204":
          description: Координаты обновлены
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/admin/events/{id}:
    delete:
      tags: [Events]
      operationId: deleteEvent
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Событие удалено
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/admin/admins:
    get:
      tags: [Admins]
      operationId: listAdmins
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Список администраторов
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Admin"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Admins]
      operationId: createAdmin
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminInput"
      responses:
        "201":
          description: Администратор создан
          content:
            application/json:
              schema:
                type: object
                required: [admin]
                properties:
                  admin:
                    $ref: "#/components/schemas/Admin"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/admin/admins/{id}/role:
    patch:
      tags: [Admins]
      operationId: changeAdminRole
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  $ref: "#/components/schemas/AdminRole"
      responses:
        "200":
          description: Роль изменена
          content:
            application/json:
              schema:
                type: object
                required: [admin]
                properties:
                  admin:
                    $ref: "#/components/schemas/Admin"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/admin/admins/{id}:
    delete:
      tags: [Admins]
      operationId: deleteAdmin
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Администратор удален
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/admin/audit-log:
    get:
      tags: [Audit]
      operationId: listAuditLog
      security:
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Журнал модерации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: histproject_session
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
    DateFrom:
      name: dateFrom
      in: query
      schema:
        type: string
        format: date
    DateTo:
      name: dateTo
      in: query
      schema:
        type: string
        format: date
  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Требуется авторизация
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Недостаточно прав
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Конфликт состояния
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Превышен лимит запросов
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Внутренняя ошибка
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    SubmissionResult:
      description: Состояние заявки изменено
      content:
        application/json:
          schema:
            type: object
            required: [submission]
            properties:
              submission:
                $ref: "#/components/schemas/Submission"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [ok, failed]
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string
    LoginInput:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          maxLength: 100
        password:
          type: string
          format: password
          maxLength: 128
    SessionResponse:
      type: object
      required: [admin]
      properties:
        admin:
          type: object
          required: [id, login, role]
          properties:
            id:
              type: integer
              format: int64
            login:
              type: string
            role:
              $ref: "#/components/schemas/AdminRole"
    AdminRole:
      type: string
      enum: [admin, super_admin]
    Admin:
      type: object
      required: [id, login, email, role, createdAt]
      properties:
        id:
          type: integer
          format: int64
        login:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/AdminRole"
        createdAt:
          type: string
          format: date-time
    CreateAdminInput:
      type: object
      required: [login, password, role]
      properties:
        login:
          type: string
          minLength: 3
          maxLength: 100
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 72
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/AdminRole"
    Coordinates:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
    Event:
      type: object
      required: [id, title, description, latitude, longitude, eventDate, eventType, siteUrl]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        eventDate:
          type: string
          format: date
        eventType:
          type: string
        siteUrl:
          type: string
          format: uri
        previewImageUrl:
          type: string
          format: uri
          nullable: true
    EventPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
          format: int64
    SubmissionStatus:
      type: string
      enum: [processing, new, review, rejected, published]
    CreateSubmissionInput:
      type: object
      required: [title, description, eventDate, eventType, email, telegramUsername, archive]
      properties:
        title:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 450
        eventDate:
          type: string
          format: date
        eventType:
          type: string
          enum: [political, military]
        email:
          type: string
          format: email
          maxLength: 70
        telegramUsername:
          type: string
          pattern: "^[A-Za-z0-9_]{5,32}$"
        archive:
          type: string
          format: binary
    Submission:
      type: object
      required: [id, title, description, eventDate, eventType, email, telegramUsername, status, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        eventDate:
          type: string
          format: date
        eventType:
          type: string
        email:
          type: string
          format: email
        telegramUsername:
          type: string
        siteUrl:
          type: string
        screenshotUrl:
          type: string
        slug:
          type: string
        status:
          $ref: "#/components/schemas/SubmissionStatus"
        adminComment:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SubmissionPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Submission"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
          format: int64
    AuditEntry:
      type: object
      required: [id, submissionId, submissionTitle, adminLogin, adminRole, action, createdAt]
      properties:
        id:
          type: integer
          format: int64
        submissionId:
          type: integer
          format: int64
        submissionTitle:
          type: string
        adminLogin:
          type: string
        adminRole:
          type: string
        action:
          type: string
        comment:
          type: string
        createdAt:
          type: string
          format: date-time
    AuditPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
          format: int64

name: Deploy

# Проверки не гоняем: код проверяется до push. Ключ на сервере ограничен
# forced command, который тянет main и запускает deploy.sh.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to 185.113.11.122
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo '185.113.11.122 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOSNEAuAQfI6jt7Kuyzxq2pMQJmlo65jVIVlR2sJYflP' > ~/.ssh/known_hosts
          ssh root@185.113.11.122
